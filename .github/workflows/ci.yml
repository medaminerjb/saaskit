name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  GO_VERSION: "1.26.5"
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.11

  sqlc:
    name: SQLC Diff Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest

      - name: Verify generated code is in sync
        run: make sqlc-check

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: saaskit
          POSTGRES_PASSWORD: saaskit
          POSTGRES_DB: saaskit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saaskit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race -count=1 -short -coverprofile=coverage.out ./...

      - name: Run integration tests
        env:
          SAASKIT_DATABASE_HOST: localhost
          SAASKIT_DATABASE_PORT: "5432"
          SAASKIT_DATABASE_USER: saaskit
          SAASKIT_DATABASE_PASSWORD: saaskit
          SAASKIT_DATABASE_NAME: saaskit_test
          SAASKIT_DATABASE_SSLMODE: disable
          SAASKIT_SERVER_SECRET: ci-test-secret-00000000000000000000000000000000000000000000
          SAASKIT_ENCRYPTION_MASTER_KEY: 6368616e676520746869732070617373776f726420746f206120736563726574
        run: go test -v -race -count=1 -run Integration ./...

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: |  
          mkdir -p bin
          go build -trimpath -o bin/saaskit ./cmd/saaskit

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t saaskit:test .

  vulncheck:
    name: Security Scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run fuzz tests (smoke test)
        run: |
          found=false
            
          for pkg in $(go list ./...); do
            fuzz_tests=$(go test "$pkg" -list '^Fuzz' | grep '^Fuzz' || true)
            for test in $fuzz_tests; do
              found=true
              echo "Running fuzz test $test for $pkg"
              go test "$pkg" -fuzz="^${test}$" -fuzztime=10s
            done
          done
            
          if [ "$found" = false ]; then
            echo "No fuzz tests found"
          fi