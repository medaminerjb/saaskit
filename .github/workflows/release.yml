name: Release SaaSKit

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  attestations: write

jobs:
  release:
    name: Build & Release SaaSKit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0


      # -------------------------
      # Go Setup
      # -------------------------

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true


      # -------------------------
      # GoReleaser
      # -------------------------

      - name: Release binaries
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign checksums with Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums
        run: |
          cosign sign-blob \
            --yes \
            --output-signature=dist/saaskit_${{ github.ref_name }}_checksums.txt.sig \
            dist/saaskit_${{ github.ref_name }}_checksums.txt

      - name: Upload signed checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-checksums
          path: |
            dist/saaskit_${{ github.ref_name }}_checksums.txt
            dist/saaskit_${{ github.ref_name }}_checksums.txt.sig



      # -------------------------
      # Docker
      # -------------------------

      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0


      - name: Setup Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0


      - name: Login GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Docker metadata
        id: meta
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "tags=\
          ghcr.io/medaminerjb/saaskit:$VERSION,\
          ghcr.io/medaminerjb/saaskit:${GITHUB_REF_NAME},\
          ghcr.io/medaminerjb/saaskit:latest" >> $GITHUB_OUTPUT



      - name: Build SaaSKit image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true

          labels: |
            org.opencontainers.image.source=https://github.com/medaminerjb/saaskit
            org.opencontainers.image.description=SaaSKit multi-tenant SaaS infrastructure framework
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}



      # -------------------------
      # SBOM
      # -------------------------

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/medaminerjb/saaskit:${{ steps.meta.outputs.version }}



      # -------------------------
      # Cosign signing
      # -------------------------

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2


      - name: Sign container image
        run: |
          cosign sign \
          --yes \
          ghcr.io/medaminerjb/saaskit:${{ steps.meta.outputs.version }}


